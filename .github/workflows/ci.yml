name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      ENV: test
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: ""
      REDIS_URL: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Static correctness checks
        run: |
          ruff check .
          python -m compileall -q config core reports maintenance manage.py
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: Security checks
        run: |
          python -m pip_audit -r requirements.txt
          python -m bandit -r config core reports maintenance manage.py \
            -x "reports/tests,reports/migrations,core/migrations,maintenance/migrations,maintenance/tests.py" \
            --severity-level high --confidence-level high --quiet

      - name: Django checks and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENV: production
          DEBUG: "False"
          SECRET_KEY: ci-production-check-only-secret-key-with-sufficient-length
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
          SITE_URL: https://example.test
          BUSINESS_LEGAL_NAME: Test Business
          BUSINESS_FREELANCE_DOCUMENT_NUMBER: FL-CI-TEST
          BUSINESS_ADDRESS: Riyadh
          BUSINESS_SUPPORT_EMAIL: legal@example.test
          BUSINESS_SUPPORT_PHONE: "+966500000000"
          DATABASE_URL: postgresql://school_reports:ci-password@postgres:5432/school_reports
          REDIS_URL: redis://redis:6379/0
          R2_ACCESS_KEY_ID: ci-access-key
          R2_SECRET_ACCESS_KEY: ci-secret-key
          R2_BUCKET_NAME: ci-private-media
          R2_ENDPOINT_URL: https://object-storage.example.test
          MEDIA_PUBLIC_ACCESS_ENABLED: "False"
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          DEFAULT_FROM_EMAIL: no-reply@example.test
        run: python manage.py check --deploy --fail-level WARNING

      - name: Test
        run: python manage.py test --verbosity 1

      - name: Build production image
        run: docker build --tag school-reports:ci .
