name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      ENV: test
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: ""
      REDIS_URL: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Static correctness checks
        run: |
          ruff check .
          python -m compileall -q config core reports maintenance manage.py
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: Django checks and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test --verbosity 1
