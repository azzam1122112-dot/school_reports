name: Configure production runtime

# Applying runtime configuration used to mean opening an SSH session and editing
# env.production by hand — so it was done rarely, remembered wrongly, and drifted
# from the repository until a release shipped with the wrong payment gateway.
#
# This makes the change a recorded, repeatable action: who ran it, when, and with
# which values, kept in the workflow log. It reuses the deploy key that already
# exists, so it grants no access that pushing to main does not already grant.
#
# Secrets are never inputs. Payment credentials are read from repository secrets
# and piped over stdin, so they stay out of argv, logs, and workflow URLs.

on:
  workflow_dispatch:
    inputs:
      tamara_enabled:
        description: "TAMARA_ENABLED — only after Tawtheeq merchant approval"
        type: choice
        options: ["False", "True"]
        default: "False"
      tamara_environment:
        description: "TAMARA_ENVIRONMENT"
        type: choice
        options: ["production", "sandbox"]
        default: "production"
      update_tamara_tokens:
        description: "Install both Tamara tokens from repository secrets"
        type: boolean
        default: false
      moyasar_enabled:
        description: "MOYASAR_ENABLED — the active launch gateway"
        type: choice
        options: ["True", "False"]
        default: "True"
      moyasar_environment:
        description: "MOYASAR_ENVIRONMENT"
        type: choice
        options: ["live", "test"]
        default: "live"
      update_moyasar_key:
        description: "Also write MOYASAR_SECRET_KEY from repository secrets"
        type: boolean
        default: false
      update_resend_config:
        description: "Install RESEND_API_KEY and RESEND_WEBHOOK_SECRET"
        type: boolean
        default: false
      pdf_offload_enabled:
        description: "PDF_OFFLOAD_ENABLED — render PDFs on the media worker"
        type: choice
        options: ["True", "False"]
        default: "True"
      celery_media_concurrency:
        description: "CELERY_MEDIA_CONCURRENCY (1-8)"
        default: "2"

permissions:
  contents: read
  # The restart pulls the released image from GHCR. Without this the pull is
  # answered with 403 and the job dies after the env file has already been
  # rewritten — the worst possible place to stop.
  packages: read

concurrency:
  group: configure-production
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Verify deploy credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          missing=""
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_SSH_USER DEPLOY_SSH_HOST; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing deploy secrets::Not set:$missing"
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Apply runtime configuration
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          MOYASAR_SECRET_KEY: ${{ secrets.MOYASAR_SECRET_KEY }}
          TAMARA_API_TOKEN: ${{ secrets.TAMARA_API_TOKEN }}
          TAMARA_NOTIFICATION_TOKEN: ${{ secrets.TAMARA_NOTIFICATION_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          FLAGS="--tamara-enabled '${{ inputs.tamara_enabled }}'"
          FLAGS="$FLAGS --tamara-environment '${{ inputs.tamara_environment }}'"
          FLAGS="$FLAGS --moyasar-enabled '${{ inputs.moyasar_enabled }}'"
          FLAGS="$FLAGS --moyasar-environment '${{ inputs.moyasar_environment }}'"
          FLAGS="$FLAGS --pdf-offload-enabled '${{ inputs.pdf_offload_enabled }}'"

          # The free-text input is the only one that can arrive empty — a cleared
          # field, or a workflow_dispatch API call that omits it. Passing it on
          # regardless reached argparse's type=int as '' and died with
          # "invalid int value: ''". That failed safe (nothing written, nothing
          # restarted) but it failed for a reason nobody could read from the form.
          # An empty value now means "leave CELERY_MEDIA_CONCURRENCY alone".
          CONCURRENCY='${{ inputs.celery_media_concurrency }}'
          if [ -n "$CONCURRENCY" ]; then
            FLAGS="$FLAGS --celery-media-concurrency '$CONCURRENCY'"
          else
            echo "::notice title=Concurrency left unchanged::No value given, so CELERY_MEDIA_CONCURRENCY keeps its current setting."
          fi

          if [ "${{ inputs.update_moyasar_key }}" = "true" ]; then
            if [ -z "$MOYASAR_SECRET_KEY" ]; then
              echo "::error title=Missing secret::Add MOYASAR_SECRET_KEY under Settings > Environments > production."
              exit 1
            fi
            FLAGS="$FLAGS --moyasar-key-from-stdin"
          fi

          # Install Tamara's pair first. This lets the guarded enable command
          # below verify the already-written server values before switching on.
          if [ "${{ inputs.update_tamara_tokens }}" = "true" ]; then
            if [ -z "$TAMARA_API_TOKEN" ] || [ -z "$TAMARA_NOTIFICATION_TOKEN" ]; then
              echo "::error title=Missing Tamara secrets::Add TAMARA_API_TOKEN and TAMARA_NOTIFICATION_TOKEN under Settings > Environments > production."
              exit 1
            fi
            printf '%s\n%s\n' "$TAMARA_API_TOKEN" "$TAMARA_NOTIFICATION_TOKEN" \
            | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
                "DEPLOY_PATH='$DEPLOY_PATH' python3 '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' --tamara-environment '${{ inputs.tamara_environment }}' --tamara-config-from-stdin"
          fi

          # The key travels on stdin only. An empty stdin leaves the value alone.
          printf '%s' "$MOYASAR_SECRET_KEY" \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' python3 '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' $FLAGS"

          if [ "${{ inputs.update_resend_config }}" = "true" ]; then
            if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_WEBHOOK_SECRET" ]; then
              echo "::error title=Missing Resend secrets::Add RESEND_API_KEY and RESEND_WEBHOOK_SECRET under Settings > Environments > production."
              exit 1
            fi
            printf '%s\n%s\n' "$RESEND_API_KEY" "$RESEND_WEBHOOK_SECRET" \
            | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
                "DEPLOY_PATH='$DEPLOY_PATH' python3 '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' --resend-config-from-stdin"
          fi

      # Restart through remote_deploy.sh, not a bare `compose up -d`.
      #
      # compose interpolates `image: ${APP_IMAGE:-school-reports:local}` from the
      # shell, never from env_file. A bare `up -d` therefore does not restart the
      # deployed image — it starts whatever that fallback resolves to. The static
      # volume still holds the real release's hashed files, so collectstatic tried
      # to replace them and died on PermissionError, migrate exited 1, and web —
      # which waits on service_completed_successfully — never came back. A config
      # change took the site down.
      #
      # remote_deploy.sh is the one path that gets this right: it requires
      # APP_IMAGE, pulls it, ensures the edge network, waits for web to report
      # healthy, and dumps logs if it does not. `:latest` is the tag the deploy
      # job pushes alongside the commit sha, so it is the running release.
      - name: Restart the services that read the file
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          printf '%s' "$GHCR_TOKEN" \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' APP_IMAGE='$IMAGE' \
               GHCR_USER='${{ github.actor }}' GHCR_TOKEN_FROM_STDIN=1 \
               bash '$DEPLOY_PATH/deploy/hetzner/remote_deploy.sh'"

      # ``compose up`` reports only that a service exited non-zero, never why.
      # When the service in question is ``migrate`` that is the difference between
      # a one-line fix and an outage spent guessing: Django refuses to boot on a
      # bad setting, and the reason is in the container's own output, nowhere else.
      - name: Show why the release failed
        if: failure()
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && docker compose -f compose.hetzner.yaml logs --tail 80 migrate web" || true

      # The same gate the deploy runs. A configuration change that leaves the
      # platform misconfigured has to fail here, not on a customer's payment.
      - name: Verify the running release
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && docker compose -f compose.hetzner.yaml \
             exec -T web python manage.py production_preflight"
