name: Deploy TANAL

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full, green commit from TANAL main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-tanal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}

    steps:
      - name: Validate requested release
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full Git commit"
            exit 1
          }

      - name: Check out exact TANAL commit
        uses: actions/checkout@v4
        with:
          repository: azzam1122112-dot/Tanal-Barbershop-Interface
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require the commit to belong to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and upload immutable release archive
        run: |
          archive="$RUNNER_TEMP/tanal-$SOURCE_SHA.tar.gz"
          git archive --format=tar.gz -o "$archive" "$SOURCE_SHA"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            "$archive" "$SSH_TARGET:/tmp/tanal-$SOURCE_SHA.tar.gz"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/release.sh "$SSH_TARGET:/tmp/tanal-release-$SOURCE_SHA.sh"

      - name: Back up, deploy, migrate, and verify TANAL
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "sudo -n bash '/tmp/tanal-release-$SOURCE_SHA.sh' \
             '/tmp/tanal-$SOURCE_SHA.tar.gz' '$SOURCE_SHA'"
          curl --fail --silent --show-error --max-time 20 \
            https://xmansx.com/api/health/readiness > /dev/null

      - name: Stamp the deployed revision in Operations Center
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && docker compose -f compose.hetzner.yaml \
             exec -T web python manage.py stamp_managed_project_release \
             xmansx '$SOURCE_SHA'"
