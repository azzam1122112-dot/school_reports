name: Migrate deployment secrets once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Copy production secrets to the new repository
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TARGET_TOKEN }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          MANAGED_DEPLOY_PUBLIC_KEY: ${{ secrets.MANAGED_DEPLOY_PUBLIC_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          TAMARA_API_TOKEN: ${{ secrets.TAMARA_API_TOKEN }}
          TAMARA_NOTIFICATION_TOKEN: ${{ secrets.TAMARA_NOTIFICATION_TOKEN }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          target='xmansx1/school_reports'
          names=(
            DEPLOY_KNOWN_HOSTS DEPLOY_SSH_HOST DEPLOY_SSH_KEY DEPLOY_SSH_USER
            FCM_SERVICE_ACCOUNT_JSON MANAGED_DEPLOY_PUBLIC_KEY RESEND_API_KEY
            RESEND_WEBHOOK_SECRET TAMARA_API_TOKEN TAMARA_NOTIFICATION_TOKEN
            WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_PUBLIC_KEY
          )
          for name in "${names[@]}"; do
            value="${!name-}"
            test -n "$value" || { echo "Missing source secret: $name"; exit 1; }
            printf '%s' "$value" | gh secret set "$name" --env production --repo "$target"
            echo "Migrated: $name"
          done