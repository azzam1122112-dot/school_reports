name: Install Managed Deploy Key

on:
  workflow_dispatch:
    inputs:
      recover_current_release:
        description: Repair static-volume ownership and restart the pinned release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure existing trusted SSH connection
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install dedicated managed-project key
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          MANAGED_DEPLOY_PUBLIC_KEY: ${{ secrets.MANAGED_DEPLOY_PUBLIC_KEY }}
        run: |
          test -n "$MANAGED_DEPLOY_PUBLIC_KEY"
          printf '%s\n' "$MANAGED_DEPLOY_PUBLIC_KEY" \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" '
              set -eu
              umask 077
              mkdir -p "$HOME/.ssh"
              touch "$HOME/.ssh/authorized_keys"
              read -r public_key
              grep -qxF "$public_key" "$HOME/.ssh/authorized_keys" \
                || printf "%s\n" "$public_key" >> "$HOME/.ssh/authorized_keys"
              chmod 700 "$HOME/.ssh"
              chmod 600 "$HOME/.ssh/authorized_keys"
              sudo -n install -d -m 700 -o root -g root /root/.ssh
              sudo -n touch /root/.ssh/authorized_keys
              if ! sudo -n grep -qxF "$public_key" /root/.ssh/authorized_keys; then
                printf "%s\n" "$public_key" | sudo -n tee -a /root/.ssh/authorized_keys >/dev/null
              fi
              sudo -n chown root:root /root/.ssh/authorized_keys
              sudo -n chmod 600 /root/.ssh/authorized_keys
              if ! id manageddeploy >/dev/null 2>&1; then
                sudo -n useradd --create-home --shell /bin/bash manageddeploy
              fi
              # useradd leaves the password field locked, and OpenSSH rejects a
              # locked account before checking authorized_keys on this host.
              # Set an unknown random hash so public-key login can proceed;
              # no reusable password is retained or printed.
              random_hash="$(openssl passwd -6 "$(openssl rand -hex 32)")"
              sudo -n usermod --password "$random_hash" manageddeploy
              unset random_hash
              sudo -n install -d -m 700 -o manageddeploy -g manageddeploy /home/manageddeploy/.ssh
              sudo -n touch /home/manageddeploy/.ssh/authorized_keys
              if ! sudo -n grep -qxF "$public_key" /home/manageddeploy/.ssh/authorized_keys; then
                printf "%s\n" "$public_key" | sudo -n tee -a /home/manageddeploy/.ssh/authorized_keys >/dev/null
              fi
              sudo -n chown manageddeploy:manageddeploy /home/manageddeploy/.ssh/authorized_keys
              sudo -n chmod 600 /home/manageddeploy/.ssh/authorized_keys
              printf "manageddeploy ALL=(root) NOPASSWD: ALL\n" \
                | sudo -n tee /etc/sudoers.d/manageddeploy >/dev/null
              sudo -n chmod 440 /etc/sudoers.d/manageddeploy
              sudo -n visudo -cf /etc/sudoers.d/manageddeploy
              printf "REMOTE_USER=%s\n" "$(id -un)"
              printf "REMOTE_USER_B64=%s\n" "$(id -un | base64 -w0)"
              sudo -n ssh-keygen -lf /root/.ssh/authorized_keys
              sudo -n sshd -T | grep -E "^(authorizedkeysfile|permitrootlogin|pubkeyauthentication|allowusers|allowgroups) " || true
              printf "HOST_ED25519="
              sudo -n cat /etc/ssh/ssh_host_ed25519_key.pub
            '

      - name: Recover the currently pinned release
        if: inputs.recover_current_release
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && \
             image=\$(sudo -n docker inspect --format '{{.Config.Image}}' school-reports-migrate-1) && \
             sudo -n docker volume create school-reports_static-data >/dev/null && \
             sudo -n docker run --rm --user 0:0 --entrypoint chown \
               -v school-reports_static-data:/app/staticfiles \
               \"\$image\" -R 10001:10001 /app/staticfiles && \
             sudo -n docker compose -f compose.hetzner.yaml -f compose.caddy.yaml up -d"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors --max-time 15 https://tawtheeq-ksa.com/healthz/ >/dev/null
