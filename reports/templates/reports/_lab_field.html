<div class="lab-field{% if field.errors %} lab-field--error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}
      <span class="lab-required">مطلوب</span>
    {% elif submission_required %}
      <span class="lab-submit-required">يلزم قبل الإرسال</span>
    {% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
