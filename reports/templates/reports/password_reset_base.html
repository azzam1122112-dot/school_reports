{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#006c35">
  <meta name="color-scheme" content="light dark">
  {% include "reports/partials/theme_bootstrap.html" %}
  <title>{% block title %}استعادة كلمة المرور{% endblock %} | منصة توثيق</title>
  <style>
    :root {
      --green: #006c35;
      --green-dark: #064e3b;
      --green-soft: #eef8f2;
      --gold: #b9975b;
      --ink: #17251f;
      --muted: #637169;
      --line: #dce7e0;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(185,151,91,.16), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(0,108,53,.12), transparent 32%),
        #f5f8f6;
      font-family: Tahoma, Arial, sans-serif;
    }
    .recovery-shell { width: min(100%, 500px); }
    .recovery-brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--green-dark);
      text-decoration: none;
      font-weight: 900;
    }
    .recovery-brand img {
      width: 46px;
      height: 46px;
      padding: 7px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 25px rgba(6,78,59,.12);
    }
    .recovery-card {
      padding: clamp(26px, 6vw, 42px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 25px 70px rgba(18,50,37,.12);
    }
    .recovery-kicker {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: .75rem;
      font-weight: 800;
    }
    h1 {
      margin: 14px 0 10px;
      color: var(--green-dark);
      font-size: clamp(1.55rem, 6vw, 2rem);
      line-height: 1.35;
    }
    .recovery-copy {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: .93rem;
      line-height: 1.9;
    }
    .recovery-form { display: grid; gap: 18px; }
    .recovery-field { display: grid; gap: 8px; }
    .recovery-label { font-size: .86rem; font-weight: 800; }
    .recovery-input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid #cbd8d0;
      border-radius: 13px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .recovery-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(0,108,53,.1);
    }
    .recovery-errors {
      margin: 0;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--danger);
      background: #fff1f0;
      font-size: .8rem;
      line-height: 1.7;
    }
    .recovery-help {
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.7;
    }
    .recovery-help ul { margin: 6px 0 0; padding-right: 20px; }
    .recovery-button {
      min-height: 52px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      box-shadow: 0 12px 28px rgba(0,108,53,.2);
      cursor: pointer;
      font: inherit;
      font-size: .95rem;
      font-weight: 800;
      line-height: 1.4;
    }
    .recovery-button:hover { filter: brightness(.97); }
    .recovery-back {
      display: inline-flex;
      margin-top: 20px;
      color: var(--green-dark);
      font-size: .85rem;
      font-weight: 800;
      text-decoration: none;
    }
    .recovery-note {
      margin-top: 20px;
      padding: 12px 14px;
      border-right: 3px solid var(--gold);
      border-radius: 10px;
      color: var(--muted);
      background: #fbf8f1;
      font-size: .78rem;
      line-height: 1.8;
    }
    @media (max-width: 560px) {
      body { padding: 14px; align-items: start; padding-top: 32px; }
      .recovery-card { border-radius: 19px; }
    }
  </style>
  <link rel="stylesheet" href="{% static 'css/dark-mode.css' %}?v=20260808.1">
  <script src="{% static 'js/theme-manager.js' %}?v=20260802.1" defer></script>
</head>
<body>
  <main class="recovery-shell">
    <a class="recovery-brand" href="{% url 'reports:landing' %}" aria-label="منصة توثيق">
      <img src="{% static 'img/brand-mark.svg' %}" alt="" width="46" height="46">
      <span>منصة توثيق</span>
    </a>
    <section class="recovery-card">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
