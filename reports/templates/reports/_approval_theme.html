{% comment %}
رموز التصميم المشتركة بين صندوق المراجعة وصفحة التفصيل.

الاشتراك مقصود: الحالة الواحدة يجب أن تحمل اللون نفسه في الشاشتين، وتكرار
اللوحة في ملفين يجعل «مُعاد للملاحظة» برتقالياً هنا وأحمرَ هناك عند أول تعديل.
{% endcomment %}
<style>
  .apr-page {
    --apr-ink: #10231a; --apr-muted: #607067; --apr-line: #dfe8e2;
    --apr-soft: #f3f8f5; --apr-surface: #ffffff;
    --apr-green: #08643b; --apr-gold: #b68a42; --apr-danger: #b42318;
    --apr-info: #1f6feb; --apr-violet: #6d4aff;
    max-width: 1180px; margin-inline: auto; padding: 1.25rem; color: var(--apr-ink);
  }
  [data-theme="dark"] .apr-page {
    --apr-ink: #eff8f2; --apr-muted: #afc1b5; --apr-line: #2d4637;
    --apr-soft: #13271c; --apr-surface: #102019;
    --apr-green: #6ed3a0; --apr-gold: #eabf58; --apr-danger: #ff9d96;
    --apr-info: #7cb2ff; --apr-violet: #b5a0ff;
  }

  .apr-hero {
    position: relative; overflow: hidden; border-radius: 20px; padding: 1.7rem 1.6rem;
    background: linear-gradient(135deg, #08643b 0%, #0a7a48 55%, #075334 100%);
    color: #fff; box-shadow: 0 18px 40px -22px rgba(8,100,59,.75);
  }
  .apr-hero::after {
    content: ""; position: absolute; inset-inline-start: -70px; inset-block-start: -90px;
    width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(182,138,66,.32), transparent 68%);
    pointer-events: none;
  }
  .apr-hero__eyebrow {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .78rem; font-weight: 800; padding: .32rem .8rem; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.24);
    color: #fff; text-decoration: none;
  }
  .apr-hero__title { margin: .75rem 0 .3rem; font-size: 1.5rem; font-weight: 900; }
  .apr-hero__meta { margin: 0; font-size: .89rem; opacity: .92; line-height: 1.8; }
  .apr-hero__note {
    position: relative; margin: 1.05rem 0 0; padding: .6rem .85rem; border-radius: 12px;
    font-size: .82rem; line-height: 1.75;
    background: rgba(0,0,0,.16); border-inline-start: 3px solid var(--apr-gold);
  }

  /* ── شارات الحالة ─────────────────────────────────────────── */
  .apr-state {
    display: inline-flex; align-items: center; gap: .35rem;
    font-size: .74rem; font-weight: 800; padding: .22rem .7rem; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .apr-state[data-tone="draft"] { color: var(--apr-muted); }
  .apr-state[data-tone="pending"] { color: var(--apr-info); }
  .apr-state[data-tone="attention"] { color: var(--apr-gold); }
  .apr-state[data-tone="recommended"] { color: var(--apr-violet); }
  .apr-state[data-tone="approved"] { color: #fff; background: var(--apr-green); border-color: transparent; }
  [data-theme="dark"] .apr-state[data-tone="approved"] { color: #06251a; }

  /* ── الأزرار ──────────────────────────────────────────────── */
  .apr-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .48rem .95rem; border-radius: 10px;
    font-size: .82rem; font-weight: 800; font-family: inherit;
    text-decoration: none; cursor: pointer; border: 1px solid transparent;
  }
  .apr-btn--primary { background: var(--apr-green); color: #fff; }
  [data-theme="dark"] .apr-btn--primary { color: #06251a; }
  .apr-btn--ghost { background: transparent; color: var(--apr-muted); border-color: var(--apr-line); }
  .apr-btn--ghost:hover { color: var(--apr-green); border-color: var(--apr-green); }
  .apr-btn--warn { background: transparent; color: var(--apr-gold); border-color: currentColor; }
  .apr-btn--violet { background: transparent; color: var(--apr-violet); border-color: currentColor; }
  .apr-btn--sm { padding: .34rem .75rem; font-size: .76rem; }

  .apr-card {
    background: var(--apr-surface); border: 1px solid var(--apr-line);
    border-radius: 16px; padding: 1.1rem 1.15rem; margin-top: 1.2rem;
    box-shadow: 0 10px 26px -24px rgba(16,35,26,.75);
  }
  .apr-card__title { font-size: 1rem; font-weight: 900; margin: 0 0 .3rem; }
  .apr-card__hint { font-size: .82rem; color: var(--apr-muted); line-height: 1.8; margin: 0 0 1rem; }

  .apr-empty { padding: 2.4rem 1rem; text-align: center; border: 1px dashed var(--apr-line); border-radius: 16px; }
  .apr-empty__icon {
    width: 58px; height: 58px; border-radius: 17px; margin: 0 auto .8rem;
    display: grid; place-items: center; font-size: 1.35rem;
    background: var(--apr-soft); color: var(--apr-green);
  }
  .apr-empty h2 { font-size: 1.02rem; font-weight: 900; margin: 0 0 .4rem; }
  .apr-empty p { font-size: .86rem; color: var(--apr-muted); margin: 0 auto; max-width: 46ch; line-height: 1.85; }
</style>
