{% load i18n static %}
<meta name="description" content="{{ seo_description }}">
<link rel="canonical" href="{{ SITE_URL }}{{ canonical_path }}">
<link rel="alternate" hreflang="ar-SA" href="{{ SITE_URL }}{{ canonical_path }}">
<link rel="alternate" hreflang="en" href="{{ SITE_URL }}{{ canonical_path }}">
<link rel="alternate" hreflang="x-default" href="{{ SITE_URL }}{{ canonical_path }}">

<meta property="og:locale" content="{% if LANGUAGE_CODE == 'en' %}en_US{% else %}ar_SA{% endif %}">
<meta property="og:locale:alternate" content="{% if LANGUAGE_CODE == 'en' %}ar_SA{% else %}en_US{% endif %}">
<meta property="og:type" content="{{ social_type|default:'website' }}">
<meta property="og:site_name" content="{% translate "منصة توثيق" %}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ SITE_URL }}{{ canonical_path }}">
<meta property="og:image" content="{{ SITE_URL }}{% static 'img/landing/dashboard-system.png' %}">
<meta property="og:image:secure_url" content="{{ SITE_URL }}{% static 'img/landing/dashboard-system.png' %}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="799">
<meta property="og:image:alt" content="{% translate 'واجهة منصة توثيق لإدارة العمل المدرسي' as default_alt %}{{ seo_image_alt|default:default_alt }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ SITE_URL }}{% static 'img/landing/dashboard-system.png' %}">
<meta name="twitter:image:alt" content="{% translate 'واجهة منصة توثيق لإدارة العمل المدرسي' as default_alt %}{{ seo_image_alt|default:default_alt }}">

{% if include_schema %}
<script type="application/ld+json" nonce="{{ CSP_NONCE }}" data-cfasync="false">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "{{ schema_type|default:'WebPage' }}",
      "@id": "{{ SITE_URL }}{{ canonical_path }}#webpage",
      "url": "{{ SITE_URL }}{{ canonical_path }}",
      "name": "{{ seo_title|escapejs }}",
      "description": "{{ seo_description|escapejs }}",
      "inLanguage": "{% if LANGUAGE_CODE == 'en' %}en{% else %}ar-SA{% endif %}",
      "isPartOf": {"@id": "{{ SITE_URL }}/#website"},
      "breadcrumb": {"@id": "{{ SITE_URL }}{{ canonical_path }}#breadcrumb"}{% if modified_date %},
      "dateModified": "{{ modified_date }}"{% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ SITE_URL }}{{ canonical_path }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "{% translate "منصة توثيق" as brand %}{{ brand|escapejs }}",
          "item": "{{ SITE_URL }}/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ seo_title|escapejs }}",
          "item": "{{ SITE_URL }}{{ canonical_path }}"
        }
      ]
    }
  ]
}
</script>
{% endif %}
