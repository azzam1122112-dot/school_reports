{% extends "base.html" %}
{% block title %}حذف مشرف{% endblock %}

{% block content %}
<div class="royal-page royal-page--narrow">
  <section class="royal-panel">
    <span class="royal-kicker">
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
      إجراء حساس
    </span>
    <h1 class="royal-title">حذف مشرف</h1>
    <p class="royal-subtitle">هل أنت متأكد من حذف المشرف التالي؟ لا يمكنه الوصول للنظام بعد تأكيد العملية.</p>

    <div class="royal-note" style="margin-top:14px">
      <div style="font-weight:950;color:var(--ink)">{{ admin_user.name }}</div>
      <div class="muted" style="font-weight:850;margin-top:4px">{{ admin_user.phone }}</div>
    </div>

    <form method="post" style="margin-top:14px">
      {% csrf_token %}
      <div class="royal-form-actions">
        <button class="btn btn-primary" type="submit" style="background:var(--danger);border-color:var(--danger)">
          <i class="fa-solid fa-trash" aria-hidden="true"></i>
          تأكيد الحذف
        </button>
        <a class="btn btn-outline" href="{% url 'reports:platform_admins_list' %}">إلغاء</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
