{% extends "base.html" %}

{% block content %}
<div class="royal-page royal-page--narrow">
  <section class="royal-panel u-text-center">
    <span class="royal-kicker xs-pdf-processing-1">
      <i class="fa-solid fa-print" aria-hidden="true"></i>
      تنبيه خدمة

      <a href="{% url 'reports:my_reports' %}" class="btn btn-primary">
