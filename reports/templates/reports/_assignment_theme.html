{% comment %}
رموز تصميم التكليفات — مشتركة بين شاشاتها الأربع.

الاشتراك يضمن أن «متأخر» أحمرُ في كل شاشة و«قريب» ذهبيٌّ في كل شاشة. لونٌ
يختلف بين قائمة المكلَّف ولوحة المكلِّف يجعل القارئ يتعلّم لغتين لشيء واحد.
{% endcomment %}
<style>
  .asg-page {
    --asg-ink: #10231a; --asg-muted: #607067; --asg-line: #dfe8e2;
    --asg-soft: #f3f8f5; --asg-surface: #ffffff;
    --asg-green: #08643b; --asg-gold: #b68a42; --asg-danger: #b42318;
    --asg-info: #1f6feb; --asg-violet: #6d4aff;
    max-width: 1180px; margin-inline: auto; padding: 1.25rem; color: var(--asg-ink);
  }
  [data-theme="dark"] .asg-page {
    --asg-ink: #eff8f2; --asg-muted: #afc1b5; --asg-line: #2d4637;
    --asg-soft: #13271c; --asg-surface: #102019;
    --asg-green: #6ed3a0; --asg-gold: #eabf58; --asg-danger: #ff9d96;
    --asg-info: #7cb2ff; --asg-violet: #b5a0ff;
  }

  .asg-hero {
    position: relative; overflow: hidden; border-radius: 20px; padding: 1.7rem 1.6rem;
    background: linear-gradient(135deg, #08643b 0%, #0a7a48 55%, #075334 100%);
    color: #fff; box-shadow: 0 18px 40px -22px rgba(8,100,59,.75);
  }
  .asg-hero::after {
    content: ""; position: absolute; inset-inline-start: -70px; inset-block-start: -90px;
    width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(182,138,66,.32), transparent 68%);
    pointer-events: none;
  }
  .asg-hero__eyebrow {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .78rem; font-weight: 800; padding: .32rem .8rem; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.24);
    color: #fff; text-decoration: none;
  }
  .asg-hero__title { margin: .75rem 0 .3rem; font-size: 1.5rem; font-weight: 900; }
  .asg-hero__meta { margin: 0; font-size: .89rem; opacity: .92; line-height: 1.8; }

  .asg-kpis { display: grid; gap: .8rem; margin-top: 1.15rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .asg-kpi {
    background: var(--asg-surface); border: 1px solid var(--asg-line);
    border-radius: 15px; padding: .9rem 1rem;
  }
  .asg-kpi__v { font-size: 1.6rem; font-weight: 900; line-height: 1.1; }
  .asg-kpi__l { font-size: .78rem; font-weight: 700; color: var(--asg-muted); margin-top: .18rem; }
  .asg-kpi[data-tone="danger"] .asg-kpi__v { color: var(--asg-danger); }
  .asg-kpi[data-tone="warn"] .asg-kpi__v { color: var(--asg-gold); }

  .asg-card {
    background: var(--asg-surface); border: 1px solid var(--asg-line);
    border-radius: 16px; padding: 1.1rem 1.15rem; margin-top: 1.2rem;
    box-shadow: 0 10px 26px -24px rgba(16,35,26,.75);
  }
  .asg-card__title { font-size: 1rem; font-weight: 900; margin: 0 0 .3rem; }
  .asg-card__hint { font-size: .82rem; color: var(--asg-muted); line-height: 1.8; margin: 0 0 1rem; }

  /* ── بطاقة تكليف ──────────────────────────────────────────── */
  .asg-item {
    display: flex; gap: .85rem; align-items: center; flex-wrap: wrap;
    padding: .85rem .95rem; border-radius: 14px; margin-bottom: .6rem;
    border: 1px solid var(--asg-line); background: var(--asg-surface);
    transition: border-color .18s ease;
  }
  .asg-item:hover { border-color: var(--asg-green); }
  .asg-item[data-late="1"] { border-inline-start: 3px solid var(--asg-danger); }
  .asg-item[data-soon="1"] { border-inline-start: 3px solid var(--asg-gold); }
  .asg-item__main { flex: 1; min-width: 200px; }
  .asg-item__title { font-size: .93rem; font-weight: 800; }
  .asg-item__title a { color: inherit; text-decoration: none; }
  .asg-item__title a:hover { text-decoration: underline; }
  .asg-item__sub { font-size: .77rem; color: var(--asg-muted); margin-top: .22rem; line-height: 1.7; }
  .asg-item__side { display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; }

  .asg-tag {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .72rem; font-weight: 800; padding: .2rem .6rem; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap; color: var(--asg-muted);
  }
  .asg-tag--late { color: var(--asg-danger); }
  .asg-tag--soon { color: var(--asg-gold); }
  .asg-tag--done { color: #fff; background: var(--asg-green); border-color: transparent; }
  [data-theme="dark"] .asg-tag--done { color: #06251a; }
  .asg-tag--urgent { color: var(--asg-danger); }

  /* ── شريط الإنجاز ─────────────────────────────────────────── */
  .asg-bar { width: 118px; }
  .asg-bar__track { height: 7px; border-radius: 999px; background: var(--asg-soft); overflow: hidden; }
  .asg-bar__fill { height: 100%; border-radius: 999px; background: var(--asg-green); }
  .asg-bar__label { font-size: .7rem; font-weight: 800; color: var(--asg-muted); margin-top: .22rem; text-align: center; }

  /* ── الأزرار والحقول ──────────────────────────────────────── */
  .asg-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .48rem .95rem; border-radius: 10px;
    font-size: .82rem; font-weight: 800; font-family: inherit;
    text-decoration: none; cursor: pointer; border: 1px solid transparent;
  }
  .asg-btn--primary { background: var(--asg-green); color: #fff; }
  [data-theme="dark"] .asg-btn--primary { color: #06251a; }
  .asg-btn--ghost { background: transparent; color: var(--asg-muted); border-color: var(--asg-line); }
  .asg-btn--ghost:hover { color: var(--asg-green); border-color: var(--asg-green); }
  .asg-btn--warn { background: transparent; color: var(--asg-gold); border-color: currentColor; }
  .asg-btn--danger { background: transparent; color: var(--asg-danger); border-color: currentColor; }
  .asg-btn--violet { background: transparent; color: var(--asg-violet); border-color: currentColor; }
  .asg-btn--sm { padding: .34rem .75rem; font-size: .76rem; }

  .asg-field { margin-bottom: .9rem; }
  .asg-field > label { display: block; font-size: .79rem; font-weight: 800; color: var(--asg-muted); margin-bottom: .35rem; }
  .asg-field input[type="text"], .asg-field input[type="number"],
  .asg-field input[type="datetime-local"], .asg-field input[type="file"],
  .asg-field select, .asg-field textarea {
    width: 100%; padding: .55rem .7rem; border-radius: 10px;
    border: 1px solid var(--asg-line); background: var(--asg-surface);
    color: var(--asg-ink); font-family: inherit; font-size: .87rem; line-height: 1.8;
  }
  .asg-field textarea { resize: vertical; }
  .asg-field :focus { outline: 2px solid var(--asg-green); outline-offset: 1px; }
  .asg-field__help { font-size: .74rem; color: var(--asg-muted); margin-top: .3rem; line-height: 1.7; }
  .asg-errors { list-style: none; margin: .35rem 0 0; padding: 0; }
  .asg-errors li { font-size: .77rem; color: var(--asg-danger); font-weight: 700; }

  .asg-empty { padding: 2.3rem 1rem; text-align: center; border: 1px dashed var(--asg-line); border-radius: 16px; }
  .asg-empty__icon {
    width: 56px; height: 56px; border-radius: 17px; margin: 0 auto .8rem;
    display: grid; place-items: center; font-size: 1.3rem;
    background: var(--asg-soft); color: var(--asg-green);
  }
  .asg-empty h2 { font-size: 1rem; font-weight: 900; margin: 0 0 .4rem; }
  .asg-empty p { font-size: .85rem; color: var(--asg-muted); margin: 0 auto; max-width: 46ch; line-height: 1.85; }

  @media (max-width: 640px) {
    .asg-page { padding: .85rem; }
    .asg-hero { padding: 1.35rem 1.15rem; border-radius: 16px; }
    .asg-hero__title { font-size: 1.24rem; }
    .asg-bar { width: 100%; }
  }
</style>
