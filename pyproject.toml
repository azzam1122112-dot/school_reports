[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "media",
  "staticfiles",
  "pytest-cache-files-*",
  "reports/migrations",
  "maintenance/migrations",
]

[tool.ruff.lint]
# Start with correctness checks that can be enforced safely on the legacy code.
select = ["E9", "F63", "F7", "F82"]
