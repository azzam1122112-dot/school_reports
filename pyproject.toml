[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "media",
  "staticfiles",
  "pytest-cache-files-*",
  "reports/migrations",
  "maintenance/migrations",
]

[tool.ruff.lint]
# القاعدة الأصلية (E9/F63/F7/F82) تمسك أخطاء الصياغة والأسماء غير المعرّفة
# وحدها. أُضيفت إليها مجموعتان تمسكان ما لا يمسكه التصريف:
#
#   S  (flake8-bandit) — الأنماط الأمنية داخل المحرر لا في CI وحده.
#   B  (flake8-bugbear) — مصائد وقتِ التشغيل: القيمة الافتراضية المتغيّرة،
#      و``except`` الفارغ الذي يبتلع الخطأ، والمتغيّر المُلتقَط في حلقة.
#
# ولا تُفعَّل ``F`` كاملة عن قصد: ``F403/F405`` تشتكيان من
# ``from ._helpers import *`` وهو **عُرف معماري** في وحدات العرض هنا لا سهو —
# مدخلات مشتركة لخمس وثلاثين شاشة. و``F401`` تعدّ استيرادات ``_helpers`` نفسها
# «غير مستعملة» بينما وجودُها هو الغرض، فحذفها آلياً يكسر كل وحدة تستوردها.
# التنظيف اللغوي شأن تغييرٍ مستقل، لا تغييرٍ أمني تجب مراجعته سطراً سطراً.
select = ["E9", "F63", "F7", "F82", "B", "S"]

ignore = [
  # S101: ``assert`` — أصلُ الاختبارات، ولا يُستعمل في كود التشغيل هنا.
  "S101",
  # S105: تُطلق على كل ثابتٍ اسمه فيه "PASSWORD" أو "SECRET" — ومعظمها هنا
  # **أسماء مفاتيح جلسة** (``FORCE_PASSWORD_CHANGE_SESSION_KEY``) أو أسماء
  # إعدادات، لا أسراراً. الأسرار الحقيقية تُقرأ من البيئة، ويحرسها
  # ``production_preflight`` بفحص قوة ``SECRET_KEY``.
  "S105",
  # S110/S112: ``except … : pass`` و``continue``. النمط مقصود في مسارات العرض
  # الثانوية: بطاقةٌ جانبية تسقط لا تُسقط الصفحة. إخضاع مئات المواضع داخل
  # تغييرٍ أمني يُغرق المراجعة فيما ليس منها.
  "S110", "S112",
  # B008: الاستدعاء داخل القيمة الافتراضية — نمط Django معتاد.
  "B008",
  # B023: المتغيّر المُلتقَط في حلقة — مستعمل فوراً في كل مواضعه هنا.
  "B023",
]

[tool.ruff.lint.per-file-ignores]
# الاختبارات: مسارات مؤقتة ثابتة وكلمات مرور تجريبية، وكلاهما بيانات اختبار.
"reports/tests/*" = ["S106", "S107", "S108"]
"maintenance/tests.py" = ["S106", "S107", "S108"]
"core/tests.py" = ["S106", "S107", "S108"]
# بيانات أداء اصطناعية: ``random`` هنا لتوليد عيّنات لا لتوليد أسرار.
"reports/management/commands/seed_perf.py" = ["S311"]
# "0.0.0.0" قيمةٌ راجعة تدلّ على «عنوان غير معروف» في حساب حدّ المعدل،
# لا ربطَ مقبس على كل الواجهات.
"core/client_ip.py" = ["S104"]
# بوابات الدفع والتنبيهات: العناوين من الإعدادات لا من المستخدم، وثابتةٌ
# قواعدُها في وحداتها (https صراحةً، ومهلة على كل نداء).
# أدوات تشغيلية يدوية: العنوان يأتي من سطر الأوامر الذي يكتبه المشغّل نفسه،
# ولا تعمل هذه الملفات داخل الخادم ولا تستقبل مدخلاً من مستخدم.
"scripts/loadtest.py" = ["S310"]
"scripts/hetzner_server_check.py" = ["S310"]
"reports/moyasar_gateway.py" = ["S310"]
"reports/tamara_gateway.py" = ["S310"]
"reports/telegram_alerts.py" = ["S310"]
"reports/mansour_assistant.py" = ["S310"]
"reports/report_ai.py" = ["S310"]
